<!--
  Citus, redrawn in currentColor.

  The supplied file carried two brand colours (#1B324F, #239646) plus Illustrator masks and opacity
  filters whose mask paths covered the whole canvas and therefore clipped nothing. Both are dropped:
  the marks in this family are rendered monochrome in the card's own ink, and a two-tone logo would
  put a colour on the page that no token owns.
-->
